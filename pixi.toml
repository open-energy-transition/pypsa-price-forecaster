[workspace]
name = "pypsa-price-forecaster"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
entsoe-py = ">=0.7.8"
holidays = ">=0.50"
joblib = ">=1.3"
lightgbm = ">=4.0"
numpy = ">=1.26"
pandas = ">=2.2"
pyarrow = ">=15"
pypsa = ">=1.0"
scikit-learn = ">=1.4"
scipy = ">=1.11"
typer = ">=0.12"

[pypi-dependencies]
pypsa-price-forecaster = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"

[feature.dashboard.dependencies]
plotly = ">=6"
streamlit = ">=1.50"

[feature.dashboard.tasks]
dashboard = "streamlit run dashboard/app.py"

# other model families for experiments/lab.py, not needed by the package
[feature.lab]
platforms = ["linux-64"]

[feature.lab.dependencies]
catboost = ">=1.2"
pytorch-cpu = ">=2.4"
xgboost = ">=2.1"

[environments]
default = { features = ["dev"], solve-group = "default" }
dashboard = { features = ["dev", "dashboard"], solve-group = "default" }
lab = { features = ["dev", "lab"], solve-group = "lab" }

[tasks]
test = "pytest"
lint = "ruff check . && ruff format --check ."
ppf = "ppf"
report = "ppf -v report data/tables/*.parquet"
