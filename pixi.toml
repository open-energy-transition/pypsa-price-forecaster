[workspace]
name = "pypsa-price-forecaster"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
entsoe-py = ">=0.7.8"
joblib = ">=1.3"
lightgbm = ">=4.0"
numpy = ">=1.26"
pandas = ">=2.2"
pyarrow = ">=15"
pypsa = ">=1.0"
scikit-learn = ">=1.4"
scipy = ">=1.11"
typer = ">=0.12"

[pypi-dependencies]
pypsa-price-forecaster = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"

[environments]
default = { features = ["dev"], solve-group = "default" }

[tasks]
test = "pytest"
lint = "ruff check . && ruff format --check ."
ppf = "ppf"
