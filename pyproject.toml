[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypsa-price-forecaster"
version = "0.1.0"
description = "Machine learning correction of PyPSA marginal prices to day-ahead electricity prices"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "entsoe-py>=0.7.8",
    "holidays>=0.50",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pypsa>=1.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.scripts]
ppf = "pypsa_price_forecaster.cli:app"
pypsa-price-forecaster = "pypsa_price_forecaster.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pypsa_price_forecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
